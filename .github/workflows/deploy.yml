name: Deploy landing to production server

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: barmentech-landing-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Download approved code
        uses: actions/checkout@v4

      - name: Publish static landing
        run: |
          rsync -av --delete \
            --include='/index.html' \
            --include='/llc-calendar-event.html' \
            --include='/meta-conversion-api.html' \
            --include='/thank-you.html' \
            --include='/assets/' \
            --include='/assets/***' \
            --exclude='*' \
            ./ /var/www/barmentech-landing/
